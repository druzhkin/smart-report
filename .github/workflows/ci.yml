name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov

      - name: Run backend tests
        run: |
          pytest tests/ --ignore=tests/test_pipeline_e2e.py -v --cov=. --cov-report=xml --cov-report=term

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E tests
        run: npm run test:e2e

  autonomous-audit:
    name: Autonomous Audit
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FULL_AUDIT_RUN_INTEGRATION: "1"
      RUN_INTEGRATION_TESTS: "1"
      SMOKE_API_BASE: ${{ secrets.SMOKE_API_BASE }}
      SMOKE_RAGFLOW_BASE_URL: ${{ secrets.SMOKE_RAGFLOW_BASE_URL }}
      SMOKE_RAGFLOW_API_KEY: ${{ secrets.SMOKE_RAGFLOW_API_KEY }}
      SMOKE_RAGFLOW_REPORTS_DATASET_ID: ${{ secrets.SMOKE_RAGFLOW_REPORTS_DATASET_ID }}
      SMOKE_RAGFLOW_FACTS_DATASET_ID: ${{ secrets.SMOKE_RAGFLOW_FACTS_DATASET_ID }}
      SMOKE_RUN_REPORT: "1"
      SMOKE_REPORT_TIMEOUT_SEC: "420"
      SMOKE_REPORT_DEPTH: "standard"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run full audit
        id: run_full_audit
        run: python scripts/full_audit.py
        continue-on-error: true

      - name: Build audit summary
        if: always()
        run: python scripts/audit_summary.py

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-audit
          path: |
            outputs/audit/latest.json
            outputs/audit/summary.md

      - name: Create issue on autonomous failure
        if: steps.run_full_audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            let summary = "No summary available.";
            try {
              summary = fs.readFileSync("outputs/audit/summary.md", "utf8");
            } catch {}

            const title = `Autonomous audit failed (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              "Autonomous CI audit failed.",
              "",
              `Run: ${runUrl}`,
              "",
              summary,
            ].join("\n");

            const { owner, repo } = context.repo;
            const openIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const exists = openIssues.data.find((issue) => issue.title === title);
            if (!exists) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
            }

      - name: Fail job if audit failed
        if: steps.run_full_audit.outcome == 'failure'
        run: exit 1
