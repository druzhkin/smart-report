services:

  # ─── Smart-Report infrastructure ──────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartreport
      POSTGRES_PASSWORD: smartreport
      POSTGRES_DB: smartreport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartreport"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── RAGFlow stack ─────────────────────────────────────────────────────────

  ragflow_mysql:
    image: mysql:8.0.39
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
    command: >
      --max_connections=1000
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --init-file /data/application/init.sql
    ports:
      - "3307:3306"
    volumes:
      - ragflow_mysql_data:/var/lib/mysql
      - ./docker/init.sql:/data/application/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_PASSWORD:-infini_rag_flow}"]
      interval: 10s
      timeout: 10s
      retries: 60
    restart: unless-stopped

  ragflow_minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "--console-address", ":9001", "/data"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-rag_flow}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-infini_rag_flow}
    volumes:
      - ragflow_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 60
    restart: unless-stopped

  ragflow_redis:
    image: valkey/valkey:8
    command:
      - "redis-server"
      - "--requirepass"
      - "${RAGFLOW_REDIS_PASSWORD:-infini_rag_flow}"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "6380:6379"
    volumes:
      - ragflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${RAGFLOW_REDIS_PASSWORD:-infini_rag_flow}", "ping"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  ragflow_es:
    image: elasticsearch:8.11.3
    environment:
      - node.name=ragflow_es
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-infini_rag_flow}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
    mem_limit: 2147483648
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9202:9200"
    volumes:
      - ragflow_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:${ELASTIC_PASSWORD:-infini_rag_flow} -f http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  ragflow:
    image: infiniflow/ragflow:v0.24.0
    ports:
      - "9088:80"
      - "9380:9380"
      - "9381:9381"
    volumes:
      - ragflow_logs:/ragflow/logs
      - ragflow_data:/ragflow/data
      - ./docker/ragflow_service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./docker/ragflow_nginx.conf:/etc/nginx/conf.d/default.conf
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
      MINIO_USER: ${MINIO_USER:-rag_flow}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-infini_rag_flow}
      RAGFLOW_REDIS_PASSWORD: ${RAGFLOW_REDIS_PASSWORD:-infini_rag_flow}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      DOC_ENGINE: elasticsearch
    depends_on:
      ragflow_mysql:
        condition: service_healthy
      ragflow_minio:
        condition: service_healthy
      ragflow_redis:
        condition: service_healthy
      ragflow_es:
        condition: service_healthy
    restart: unless-stopped

  # ─── Application services ──────────────────────────────────────────────────

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://smartreport:smartreport@postgres:5432/smartreport
      REDIS_URL: redis://redis:6379
      RAGFLOW_BASE_URL: http://ragflow:9380
    volumes:
      - ./backend:/app/backend
      - ./prompts:/app/prompts
      - ./prompt_library:/app/prompt_library
      - outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  ragflow_mysql_data:
  ragflow_minio_data:
  ragflow_redis_data:
  ragflow_es_data:
  ragflow_logs:
  ragflow_data:
  outputs:
