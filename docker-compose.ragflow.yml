services:
  ragflow-mysql:
    image: mysql:8.0.39
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
    command: >
      --max_connections=1000
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --init-file /data/application/init.sql
    volumes:
      - ragflow_mysql_data:/var/lib/mysql
      - ./docker/init.sql:/data/application/init.sql

  ragflow-minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-rag_flow}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-infini_rag_flow}
    volumes:
      - ragflow_minio_data:/data

  ragflow-redis:
    image: valkey/valkey:8
    command:
      - "redis-server"
      - "--requirepass"
      - "${RAGFLOW_REDIS_PASSWORD:-infini_rag_flow}"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - ragflow_redis_data:/data

  ragflow-es:
    image: elasticsearch:8.11.3
    environment:
      node.name: ragflow_es
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      bootstrap.memory_lock: "false"
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
    mem_limit: 2147483648
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ragflow_es_data:/usr/share/elasticsearch/data

  ragflow:
    image: infiniflow/ragflow:v0.24.0
    ports:
      - "9380:9380"
      - "9381:9381"
      - "80:80"
    volumes:
      - ragflow_logs:/ragflow/logs
      - ragflow_data:/ragflow/data
      - ./docker/ragflow_service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./docker/ragflow_nginx.conf:/etc/nginx/conf.d/default.conf
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
      MINIO_USER: ${MINIO_USER:-rag_flow}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-infini_rag_flow}
      RAGFLOW_REDIS_PASSWORD: ${RAGFLOW_REDIS_PASSWORD:-infini_rag_flow}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      DOC_ENGINE: elasticsearch
    depends_on:
      - ragflow-mysql
      - ragflow-minio
      - ragflow-redis
      - ragflow-es

volumes:
  ragflow_mysql_data:
  ragflow_minio_data:
  ragflow_redis_data:
  ragflow_es_data:
  ragflow_logs:
  ragflow_data:
