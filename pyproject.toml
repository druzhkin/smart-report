[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-report-mvp"
version = "0.3.0"
description = "Personal analytical engine — matrix method (domains x layers) with cross-domain bisociation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daniil" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "click>=8.1",
    "json-repair>=0.30",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "reportlab>=4.2",
    "pypdf>=5.0",
    "paper-search-mcp==0.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
smart-report = "run:cli"

[tool.setuptools.packages.find]
include = ["smart_report*"]
exclude = ["tests*", "runs*", "reference*", "eval*", "scripts*", "prompts*"]

[tool.setuptools.package-data]
smart_report = ["exporters/premium/templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-m 'not expensive and not live'"
markers = [
    "expensive: marks tests as expensive (real LLM calls, skip by default; run with -m expensive)",
    "live: marks tests as hitting real third-party APIs (skip by default; run with -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
