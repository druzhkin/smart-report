[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-report"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # API framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # LLM / agents
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.1",
    "langsmith>=0.2",
    "openai>=1.54",           # used for OpenRouter (OpenAI-compatible)
    # Validation / settings
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Resilience
    "tenacity>=9.0",
    # Logging
    "loguru>=0.7",
    # HTTP
    "httpx>=0.27",
    "sse-starlette>=2.2",
    # Database
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    # Cache / queues
    "redis[asyncio]>=5.2",
    # Env
    "python-dotenv>=1.0",
    # Knowledge library
    "aiosqlite>=0.20",
    "apscheduler>=3.10,<4.0",
    # Citation verification
    "aiohttp>=3.10",
    "sentence-transformers>=3.3",
    "firecrawl-py>=1.5",
    # Visualization
    "plotly>=6.0",
    "kaleido>=0.4",
    # Report rendering
    "weasyprint>=63.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "pypdf>=5.0",
    "markdown>=3.7",
    "Jinja2>=3.1",
    "pywebpush>=2.0",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",            # for TestClient
    "respx>=0.22",            # httpx mock for agent HTTP tests
    "alembic>=1.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "agents*", "schemas*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: runs against real OpenRouter API (deselect with -m 'not integration')",
]
