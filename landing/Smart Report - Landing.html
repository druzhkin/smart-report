<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Smart Report — Landing</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="landing.css?v=9" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="landing_shared.jsx?v=9"></script>
<script type="text/babel" src="landing_a_sales.jsx?v=9"></script>
<script type="text/babel" src="landing_b_product.jsx?v=9"></script>
<script type="text/babel" src="landing_c_content.jsx?v=9"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [variant, setVariant] = useState(() => localStorage.getItem("sr-landing-variant") || "a");
  useEffect(() => { localStorage.setItem("sr-landing-variant", variant); }, [variant]);

  // scroll to top on switch
  useEffect(() => { window.scrollTo({ top: 0, behavior: "instant" }); }, [variant]);

  const Variant = variant === "a" ? window.LandingA
                : variant === "b" ? window.LandingB
                : window.LandingC;

  return (
    <>
      <window.VariantSwitcher value={variant} onChange={setVariant} />
      <Variant />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
