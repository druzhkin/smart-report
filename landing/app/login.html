<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Smart Report — вход</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/app.css?v=1" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// Pydantic 422 returns `detail` as an array of {loc, msg, type, ...}
// objects, NOT a string. Coerce to a readable string before rendering.
function formatError(data, fallback) {
  if (!data) return fallback || "Что-то пошло не так";
  const d = data.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d)) {
    return d.map(e => {
      const where = Array.isArray(e.loc) ? e.loc.join(".") : "";
      const msg = e.msg || e.type || JSON.stringify(e);
      return where ? `${where}: ${msg}` : msg;
    }).join("; ");
  }
  if (d && typeof d === "object") return JSON.stringify(d);
  return fallback || "Что-то пошло не так";
}

function App() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [status, setStatus] = useState("idle");
  const [error, setError] = useState("");

  useEffect(() => {
    fetch("/api/auth/me").then(r => r.json()).then(d => {
      if (d.authenticated) window.location.href = "/app/dashboard.html";
    });
  }, []);

  const submit = async (e) => {
    e.preventDefault();
    setStatus("sending"); setError("");
    try {
      const r = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email.trim(), password }),
      });
      if (r.ok) { window.location.href = "/app/dashboard.html"; return; }
      const data = await r.json().catch(() => ({}));
      setStatus("error");
      setError(formatError(data, `HTTP ${r.status}`));
    } catch (err) {
      setStatus("error"); setError(String(err));
    }
  };

  return (
    <div className="app-page">
      <div className="app-topbar">
        <a href="/landing/" style={{textDecoration: "none"}}>
          <div className="app-brand">
            <div className="app-brand-mark">SR</div>
            <div>
              <div>Smart Report</div>
              <div className="app-brand-meta">v.IV · research orchestrator</div>
            </div>
          </div>
        </a>
        <div className="app-userbar">
          <a href="/app/signup.html">Нет аккаунта? Зарегистрироваться</a>
        </div>
      </div>

      <div className="app-card" style={{maxWidth: 460, margin: "40px auto"}}>
        <div className="app-eyebrow">02 · Вход</div>
        <h1>Войдите в кабинет.</h1>
        <p className="lead">Email и пароль — те, что использовали при регистрации.</p>

        <form onSubmit={submit}>
          {status === "error" && <div className="alert alert-error">{error}</div>}
          <label>
            <span>Email</span>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                   autoFocus required placeholder="you@company.ru" />
          </label>
          <label>
            <span>Пароль</span>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                   required placeholder="••••••••" />
          </label>
          <button type="submit" className="btn" disabled={status === "sending"}>
            {status === "sending" ? "Входим…" : "Войти →"}
          </button>
        </form>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
