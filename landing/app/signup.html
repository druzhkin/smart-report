<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Smart Report — регистрация</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/app.css?v=1" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [status, setStatus] = useState("idle"); // idle | sending | error
  const [error, setError] = useState("");

  // Bounce to dashboard if already authed
  useEffect(() => {
    fetch("/api/auth/me").then(r => r.json()).then(d => {
      if (d.authenticated) window.location.href = "/app/dashboard.html";
    });
  }, []);

  const submit = async (e) => {
    e.preventDefault();
    setStatus("sending"); setError("");
    try {
      const r = await fetch("/api/auth/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email.trim(), password }),
      });
      if (r.ok) { window.location.href = "/app/dashboard.html"; return; }
      const data = await r.json().catch(() => ({}));
      setStatus("error");
      setError(data.detail || `HTTP ${r.status}`);
    } catch (err) {
      setStatus("error"); setError(String(err));
    }
  };

  return (
    <div className="app-page">
      <div className="app-topbar">
        <a href="/landing/" style={{textDecoration: "none"}}>
          <div className="app-brand">
            <div className="app-brand-mark">SR</div>
            <div>
              <div>Smart Report</div>
              <div className="app-brand-meta">v.IV · research orchestrator</div>
            </div>
          </div>
        </a>
        <div className="app-userbar">
          <a href="/app/login.html">Уже есть аккаунт? Войти</a>
        </div>
      </div>

      <div className="app-card" style={{maxWidth: 460, margin: "40px auto"}}>
        <div className="app-eyebrow">01 · Регистрация</div>
        <h1>Создайте аккаунт.</h1>
        <p className="lead">
          После регистрации сразу можете создать отчёт. Никакого подтверждения
          email — это демо-SaaS. Платежи и подписки ещё не подключены, отчёты
          бесплатные пока в beta.
        </p>

        <form onSubmit={submit}>
          {status === "error" && <div className="alert alert-error">{error}</div>}
          <label>
            <span>Email</span>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                   autoFocus required placeholder="you@company.ru" />
          </label>
          <label>
            <span>Пароль (минимум 6 символов)</span>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                   required minLength="6" placeholder="••••••••" />
          </label>
          <button type="submit" className="btn" disabled={status === "sending"}>
            {status === "sending" ? "Создаём…" : "Зарегистрироваться →"}
          </button>
        </form>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
