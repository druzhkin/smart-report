<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Smart Report v.IV</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chat.css?v=17" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="mock_data.js?v=2"></script>
</head>
<template id="__bundler_thumbnail" data-bg-color="#0F1012">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0F1012"/>
    <text x="600" y="380" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="180" font-weight="600" fill="#F2F2F2" letter-spacing="-4">SR</text>
    <rect x="540" y="430" width="120" height="3" fill="oklch(0.72 0.18 56)"/>
    <text x="600" y="490" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" font-weight="500" fill="#A6A6A6" letter-spacing="6">SMART REPORT v.IV</text>
  </svg>
</template>
<body>
<div id="root"></div>

<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="sections_1_3.jsx"></script>
<script type="text/babel" src="sections_4_6.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "orange",
  "density": "comfortable"
}/*EDITMODE-END*/;

const PHASE = {
  START: "start",
  PROMPT: "prompt",
  UPLOAD: "upload",
  CRITIQUE: "critique",
  TOPUP: "topup",
  FINAL: "final",
  DONE: "done"
};

// Phase stepper definition
const PHASE_STEPS = [
  { key: "intake",   num: "01", label: "Вопрос",     when: p => ["start"].includes(p) },
  { key: "prompt",   num: "02", label: "Промт",      when: p => ["prompt", "upload"].includes(p) },
  { key: "critique", num: "03", label: "Критика",    when: p => ["critique"].includes(p) },
  { key: "topup",    num: "04", label: "Добор",      when: p => ["topup"].includes(p) },
  { key: "final",    num: "05", label: "Отчёт",      when: p => ["done"].includes(p) }
];

const PROJECTS = window.MOCK_PROJECTS;

function App() {
  const mock = window.MOCK;

  // State
  const [messages, setMessages] = useState(() => {
    const saved = localStorage.getItem("sr-msgs-v2");
    if (saved) { try { return JSON.parse(saved); } catch(e) {} }
    return [{
      id: "m0",
      role: "system",
      kind: "text",
      content: "Я — Smart Report. Помогу с глубоким исследованием по одному вопросу.\n\nСформулируйте задачу так, как если бы вы ставили её старшему аналитику. Я превращу её в research-промт, соберу результаты внешних DR, найду противоречия и соберу отчёт уровня акционера."
    }];
  });
  const [phase, setPhase] = useState(() => localStorage.getItem("sr-phase-v2") || PHASE.START);
  const [cost, setCost] = useState(() => +(localStorage.getItem("sr-cost-v2") || 0));
  const [sessionTitle, setSessionTitle] = useState(() =>
    localStorage.getItem("sr-title-v2") || "Новая сессия"
  );
  const [input, setInput] = useState("");
  const [activeCite, setActiveCite] = useState(null);
  const [pending, setPending] = useState(false);

  // Artifact panel state
  const [artifact, setArtifact] = useState(null); // { kind: 'prompt'|'upload'|'critique'|'report' }
  const [sidebarOpen, setSidebarOpen] = useState(true);

  // Projects + sidebar state
  const [expandedProjects, setExpandedProjects] = useState(() => {
    const saved = localStorage.getItem("sr-expanded-v2");
    if (saved) { try { return JSON.parse(saved); } catch(e) {} }
    return { "p-premium-resi": true };
  });
  const [activeProjectId, setActiveProjectId] = useState("p-premium-resi");
  const [sidebarQuery, setSidebarQuery] = useState("");

  useEffect(() => {
    localStorage.setItem("sr-expanded-v2", JSON.stringify(expandedProjects));
  }, [expandedProjects]);

  const toggleProject = (id) => setExpandedProjects(p => ({ ...p, [id]: !p[id] }));

  // UI overlays
  const [costOpen, setCostOpen] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const [toast, setToast] = useState(null);
  const [exportOpen, setExportOpen] = useState(false);
  const [theme, setTheme] = useState(() => {
    const saved = localStorage.getItem("sr-theme");
    if (saved === "dark" || saved === "light") return saved;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  });

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("sr-theme", theme);
  }, [theme]);

  // Global keyboard shortcuts
  useEffect(() => {
    const onKey = (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (!mod) return;
      const k = e.key.toLowerCase();
      if (k === "k") {
        e.preventDefault();
        setSidebarOpen(true);
        setTimeout(() => searchRef.current?.focus(), 60);
      } else if (k === "n") {
        e.preventDefault();
        setConfirmReset(true);
      } else if (k === "/") {
        e.preventDefault();
        textareaRef.current?.focus();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const scrollRef = useRef(null);
  const textareaRef = useRef(null);
  const titleRef = useRef(null);
  const searchRef = useRef(null);

  // Persist
  useEffect(() => {
    localStorage.setItem("sr-msgs-v2", JSON.stringify(messages));
    localStorage.setItem("sr-phase-v2", phase);
    localStorage.setItem("sr-cost-v2", String(cost));
    localStorage.setItem("sr-title-v2", sessionTitle);
  }, [messages, phase, cost, sessionTitle]);

  // Autoscroll chat
  useEffect(() => {
    if (!scrollRef.current) return;
    const el = scrollRef.current;
    requestAnimationFrame(() => {
      el.scrollTo({ top: el.scrollHeight, behavior: "smooth" });
    });
  }, [messages.length, pending]);

  const push = (msg) => setMessages(ms => [...ms, { id: "m" + (ms.length + 1) + "-" + Date.now(), ...msg }]);
  const openSource = (n) => setActiveCite(n);
  const closeSource = () => setActiveCite(null);

  const showToast = (text, action, duration = 4500) => {
    setToast({ text, action });
    setTimeout(() => setToast(null), duration);
  };

  // ========== Flow handlers ==========
  const onSubmitQuestion = (text) => {
    if (!text.trim() || pending) return;
    // Auto-title from first question
    if (sessionTitle === "Новая сессия") {
      const words = text.split(" ").slice(0, 7).join(" ");
      setSessionTitle(words + (text.split(" ").length > 7 ? "…" : ""));
    }
    push({ role: "user", kind: "text", content: text });
    setInput("");
    setPending(true);

    push({ role: "system", kind: "thinking", traces: [
      "разбираю вопрос на подвопросы",
      "выделено 8 подвопросов · сегмент: business + premium",
      "подбор источников · 12 приоритетных",
      "генерация промта · структура 6 разделов",
      "финализация директив · добавлен критерий A/B/C",
      "выбор инструмента · рекомендован Claude Research"
    ], onDone: () => {
      setMessages(ms => ms.filter(m => m.kind !== "thinking"));
      setCost(c => c + 12.40);
      push({
        role: "system",
        kind: "text",
        content: "Промт готов — 1 482 слова, 6 разделов, явная директива «Сводная таблица данных» в конце.\n\nРекомендую Claude Research: задача требует синтеза 50+ источников и корректной маркировки неподтверждённых цифр."
      });
      push({
        role: "system",
        kind: "ref",
        refKind: "prompt",
        title: "Research-промт",
        subtitle: "1 482 слова · 6 разделов · Claude Research",
        accent: true
      });
      push({
        role: "system",
        kind: "cta",
        primary: "Копировать и запустить внешний DR →",
        action: "copy-prompt",
        secondary: "Пропустить — я уже запустил",
        secondaryAction: "go-upload-stage"
      });
      setPhase(PHASE.PROMPT);
      setArtifact({ kind: "prompt" });
      setPending(false);
    }});
  };

  const goToUploadStage = () => {
    push({ role: "user", kind: "text", content: "Я уже запустил внешний DR" });
    push({
      role: "system",
      kind: "text",
      content: "Хорошо. Когда отчёты будут готовы — загружайте их. Поддерживаю .md, .txt, .pdf — до 10 файлов за раз."
    });
    push({ role: "system", kind: "ref", refKind: "upload", title: "Загрузка отчётов", subtitle: "ожидание файлов" });
    push({ role: "system", kind: "cta", primary: "Симулировать загрузку (demo)", action: "go-upload" });
    setArtifact({ kind: "upload-stage" });
    setPhase(PHASE.UPLOAD);
  };

  const actUpload = () => {
    push({ role: "user", kind: "text", content: "Отчёты готовы — вот они" });
    setPending(true);
    push({ role: "system", kind: "thinking", traces: [
      "читаю Claude-Research-moscow-premium-v1.md · 14 820 слов",
      "читаю Perplexity-DR-amenities-benchmark.md · 5 412 слов",
      "читаю OpenAI-DR-developer-economics.md · 7 104 слов",
      "читаю Intermark-Q1-2026-notes.md · 2 108 слов",
      "читаю NF-Group-premium-residential-2025.md · 3 240 слов",
      "извлечение фактов · 312 утверждений · 94 цифры",
      "сверка между источниками · поиск противоречий"
    ], onDone: () => {
      setMessages(ms => ms.filter(m => m.kind !== "thinking"));
      setCost(c => c + 176.72);
      push({ role: "system", kind: "ref", refKind: "upload", title: "5 отчётов загружено", subtitle: "32 684 слов · 94 метрики" });
      push({
        role: "system",
        kind: "text",
        content: "Прочитал 5 отчётов — 32 684 слов, 94 числовых утверждения. Нашёл 7 согласий, 5 противоречий, 5 пробелов и 3 неподтверждённые цифры.\n\nПротиворечия — главное. Разбираем?"
      });
      push({ role: "system", kind: "ref", refKind: "critique", title: "Критика и сверка", subtitle: "7 · 5 · 5 · 3", accent: true });
      push({
        role: "system",
        kind: "cta",
        primary: "Запустить followup-добор",
        action: "go-topup",
        secondary: "Пропустить — собирать финал",
        secondaryAction: "go-final-direct"
      });
      setPhase(PHASE.CRITIQUE);
      setArtifact({ kind: "critique" });
      setPending(false);
    }});
  };

  const actTopup = () => {
    push({ role: "user", kind: "text", content: "Запускай followup — хочу закрыть пробелы" });
    setPending(true);
    push({ role: "system", kind: "thinking", traces: [
      "генерация followup-промта · 420 слов",
      "ожидание загрузки followup-отчёта",
      "приём Claude-Research-followup.md · 4 640 слов",
      "сверка: закрылось 4 из 5 пробелов",
      "IT vs традиционный бизнес — остался качественным"
    ], onDone: () => {
      setMessages(ms => ms.filter(m => m.kind !== "thinking"));
      setCost(c => c + 64.08);
      push({
        role: "system",
        kind: "text",
        content: "Добор сработал. Закрылись: ROI сигарных, фасадные материалы, МОПы, международная 10-летняя траектория. Не закрылся поведенческий разрез IT vs традиционный бизнес — обозначу явно как ограничение.\n\nБаза достаточна для отчёта уровня акционера."
      });
      push({ role: "system", kind: "cta", primary: "Собрать финальный отчёт →", action: "go-final" });
      setPhase(PHASE.TOPUP);
      setPending(false);
    }});
  };

  const actFinalDirect = () => {
    push({ role: "user", kind: "text", content: "Пропустим добор — базы достаточно" });
    actFinal();
  };

  const actFinal = () => {
    setPending(true);
    push({ role: "system", kind: "thinking", traces: [
      "сборка документа · 6 разделов",
      "QA секция · 8 прямых ответов",
      "извлечение headline-цифр · 7 значений",
      "ранжирование факторов · 11 позиций",
      "верстка таблиц · 3 штуки",
      "библиография · 74 источника",
      "финальная проверка цитирования"
    ], onDone: () => {
      setMessages(ms => ms.filter(m => m.kind !== "thinking"));
      setCost(c => Math.max(c + 594, 847.20));
      push({
        role: "system",
        kind: "text",
        content: "Отчёт готов. Открыл справа — там sticky-оглавление слева, цифры с [N] кликабельны. Для экспорта — кнопки в шапке артефакта."
      });
      push({ role: "system", kind: "ref", refKind: "report", title: mock.finalReport.title, subtitle: "74 источника · ₽ 847", accent: true });
      setPhase(PHASE.DONE);
      setArtifact({ kind: "report" });
      setPending(false);
    }});
  };

  const copyPrompt = () => {
    const flat = mock.promptSections.map(s => {
      const body = s.body || (s.bullets ? s.bullets.map(b => "— " + b).join("\n") : "");
      return `## ${s.title}\n\n${body}`;
    }).join("\n\n");
    try { navigator.clipboard.writeText(flat); } catch(e) {}
    showToast("Промт скопирован — 1 482 слова");
  };

  const onCta = (action) => {
    if (pending) return;
    if (action === "copy-prompt") { copyPrompt(); goToUploadStage(); }
    else if (action === "go-upload-stage") goToUploadStage();
    else if (action === "go-upload") actUpload();
    else if (action === "go-topup") actTopup();
    else if (action === "go-final") actFinal();
    else if (action === "go-final-direct") actFinalDirect();
  };

  const onSend = () => {
    if (!input.trim() || pending) return;
    if (phase === PHASE.START) onSubmitQuestion(input);
    else {
      push({ role: "user", kind: "text", content: input });
      setInput("");
      push({
        role: "system",
        kind: "text",
        content: "В этом демо после финального отчёта диалог не продолжается. В продакшене система ответит на уточняющие вопросы из уже собранной базы источников."
      });
    }
  };

  const onKey = (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      onSend();
    }
  };

  // Textarea autosize
  useEffect(() => {
    const t = textareaRef.current;
    if (!t) return;
    t.style.height = "auto";
    t.style.height = Math.min(180, Math.max(44, t.scrollHeight)) + "px";
  }, [input]);

  // Tweaks
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweakOpen, setTweakOpen] = useState(false);
  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== "object") return;
      if (e.data.type === "__activate_edit_mode") setTweakOpen(true);
      if (e.data.type === "__deactivate_edit_mode") setTweakOpen(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);
  useEffect(() => {
    const map = {
      "orange": ["oklch(0.58 0.18 35)", "oklch(0.42 0.14 35)", "oklch(0.58 0.18 35 / 0.09)"],
      "red":    ["oklch(0.52 0.21 25)", "oklch(0.38 0.18 25)", "oklch(0.52 0.21 25 / 0.09)"],
      "blue":   ["oklch(0.48 0.16 245)", "oklch(0.34 0.12 245)", "oklch(0.48 0.16 245 / 0.09)"],
      "green":  ["oklch(0.48 0.14 155)", "oklch(0.34 0.11 155)", "oklch(0.48 0.14 155 / 0.09)"],
      "ink":    ["#141414", "#141414", "#14141414"]
    };
    const [a, ai, soft] = map[tweaks.accent] || map.orange;
    document.documentElement.style.setProperty("--accent", a);
    document.documentElement.style.setProperty("--accent-ink", ai);
    document.documentElement.style.setProperty("--accent-soft", soft);
  }, [tweaks]);
  const updateTweak = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*");
  };

  // Reset flow (undo-able)
  const doReset = () => {
    const backup = { messages, phase, cost, sessionTitle };
    localStorage.removeItem("sr-msgs-v2");
    localStorage.removeItem("sr-phase-v2");
    localStorage.removeItem("sr-cost-v2");
    localStorage.removeItem("sr-title-v2");
    setMessages([{
      id: "m0",
      role: "system",
      kind: "text",
      content: "Я — Smart Report. Помогу с глубоким исследованием по одному вопросу.\n\nСформулируйте задачу так, как если бы вы ставили её старшему аналитику. Я превращу её в research-промт, соберу результаты внешних DR, найду противоречия и соберу отчёт уровня акционера."
    }]);
    setPhase(PHASE.START);
    setCost(0);
    setSessionTitle("Новая сессия");
    setArtifact(null);
    setConfirmReset(false);
    showToast("Сессия очищена", {
      label: "отменить",
      run: () => {
        setMessages(backup.messages);
        setPhase(backup.phase);
        setCost(backup.cost);
        setSessionTitle(backup.sessionTitle);
      }
    }, 8000);
  };

  // Render message
  const renderMsg = (m) => {
    if (m.kind === "text") {
      return (
        <Msg key={m.id} role={m.role}>
          {m.content.split("\n\n").map((p, j) => <p key={j}>{p}</p>)}
        </Msg>
      );
    }
    if (m.kind === "thinking") {
      return <Msg key={m.id} role="system"><Thinking traces={m.traces} duration={2200} onDone={m.onDone} /></Msg>;
    }
    if (m.kind === "ref") {
      const isActive = artifact?.kind === m.refKind ||
                       (artifact?.kind === "upload-stage" && m.refKind === "upload");
      return (
        <Msg key={m.id} role="system">
          <ArtifactRef
            kind={m.refKind}
            title={m.title}
            subtitle={m.subtitle}
            active={isActive}
            accent={m.accent}
            onClick={() => setArtifact({ kind: m.refKind })}
          />
        </Msg>
      );
    }
    if (m.kind === "cta") {
      return (
        <Msg key={m.id} role="system">
          <div className="inline-actions">
            <button className="inline-btn primary" onClick={() => onCta(m.action)}>{m.primary}</button>
            {m.secondary && (
              <button className="inline-btn" onClick={() => onCta(m.secondaryAction || m.action)}>{m.secondary}</button>
            )}
          </div>
        </Msg>
      );
    }
    return null;
  };

  // Phase stepper state
  const currentStepIdx = PHASE_STEPS.findIndex(s => s.when(phase));

  // Artifact header content
  const artifactHead = (() => {
    if (!artifact) return null;
    if (artifact.kind === "prompt") {
      return {
        kind: "Промт",
        title: "Research-промт для Claude Research",
        actions: (
          <>
            <button className="icon-btn" onClick={() => showToast("Редактирование промта — в следующей итерации")}>изменить</button>
            <button className="icon-btn primary" onClick={copyPrompt}>скопировать</button>
          </>
        )
      };
    }
    if (artifact.kind === "upload" || artifact.kind === "upload-stage") {
      return {
        kind: "Загрузка",
        title: artifact.kind === "upload" ? "Принятые отчёты (5)" : "Ожидание файлов",
        actions: (
          <button className="icon-btn primary" onClick={() => artifact.kind === "upload-stage" ? actUpload() : null}>
            {artifact.kind === "upload-stage" ? "имитировать загрузку" : "добавить ещё"}
          </button>
        )
      };
    }
    if (artifact.kind === "critique") {
      return {
        kind: "Критика",
        title: "Сверка пяти отчётов",
        actions: (
          <button className="icon-btn primary" onClick={() => { setArtifact(null); actTopup(); }}>
            запустить добор
          </button>
        )
      };
    }
    if (artifact.kind === "report") {
      return {
        kind: "Отчёт",
        title: mock.finalReport.title,
        actions: (
          <>
            <button className="icon-btn" onClick={() => setExportOpen(true)}>
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" style={{marginRight: 5, verticalAlign: '-1px'}}>
                <path d="M6 1.5v6.2M3.3 5.5L6 8.2l2.7-2.7M2 10.2h8" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
              экспорт
            </button>
            <button className="icon-btn accent" onClick={() => showToast("Отчёт расшарен по ссылке (demo)")}>поделиться →</button>
          </>
        )
      };
    }

        </>
      )}

      {/* ========== TOAST ========== */}
      <div className={"toast" + (toast ? " show" : "")}>
        <span>{toast?.text}</span>
        {toast?.action && (
          <button onClick={() => { toast.action.run(); setToast(null); }}>{toast.action.label}</button>
        )}
      </div>

      {/* ========== TWEAKS ========== */}
      <div className={"tweaks-panel" + (tweakOpen ? " is-open" : "")}>
        <h4>Tweaks</h4>
        <div style={{ opacity: 0.7, marginBottom: 4, marginTop: 8 }}>Акцент</div>
        {["orange", "red", "blue", "green", "ink"].map(c => (
          <label key={c}>
            <input type="radio" name="accent" checked={tweaks.accent === c} onChange={() => updateTweak("accent", c)} />
            {" "}{c}
          </label>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
